spring.application.name=DebuggerService

spring.datasource.url=jdbc:mysql://localhost:3307/debuggerdb
spring.datasource.username=myuser
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=debugger-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=org.distributeddebugger.debuggerservice.event.TransactionEventPayload
spring.kafka.consumer.properties.spring.json.trusted.packages=org.distributeddebugger.debuggerservice.event

app.kafka.topics.transaction-events=transaction-events

spring.docker.compose.profiles.active=