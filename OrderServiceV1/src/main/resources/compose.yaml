services:
  mysql:
    image: mysql:8.4
    container_name: order-service-mysql
    environment:
      MYSQL_DATABASE: orderdb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: verysecret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: